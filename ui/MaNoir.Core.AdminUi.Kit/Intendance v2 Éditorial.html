<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Intendance — Éditorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   INTENDANCE — Direction éditoriale minimaliste
   Fraunces (serif expressif) · Inter (sans neutre) · JetBrains Mono
   Ivoire / encre / un accent profond
   ═══════════════════════════════════════════════════════════ */

:root {
  --ivory:      oklch(97.8% 0.008 85);
  --ivory-2:    oklch(96.2% 0.010 85);
  --paper:      oklch(99.2% 0.004 85);
  --ink:        oklch(20% 0.015 60);
  --ink-2:      oklch(38% 0.012 60);
  --ink-3:      oklch(58% 0.010 60);
  --ink-4:      oklch(74% 0.008 60);
  --rule:       oklch(86% 0.010 60);
  --rule-2:     oklch(91% 0.008 60);

  /* Un seul accent profond — prune encre */
  --accent:     oklch(42% 0.13 25);
  --accent-2:   oklch(52% 0.14 25);
  --accent-tint:oklch(94% 0.025 25);

  /* États — très désaturés, presque monochromes */
  --ok:         oklch(44% 0.08 145);
  --ok-tint:    oklch(94% 0.020 145);
  --warn:       oklch(52% 0.10 65);
  --warn-tint:  oklch(95% 0.025 65);
  --danger:     oklch(45% 0.14 25);
  --danger-tint:oklch(94% 0.030 25);

  --f-display:  "Instrument Sans", "Inter", -apple-system, system-ui, sans-serif;
  --f-sans:     "Inter", -apple-system, system-ui, sans-serif;
  --f-serif:    "Inter", -apple-system, system-ui, sans-serif; /* legacy alias — sans now */
  --f-mono:     "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--f-sans);
  font-size: 14px; line-height: 1.55;
  color: var(--ink);
  background: var(--ivory);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
  text-rendering: optimizeLegibility;
}
html, body { height: 100%; overflow: hidden; }

button { font: inherit; cursor: pointer; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ── Typography scale ───────────────────────────────────── */
.serif { font-family: var(--f-display); font-weight: 500; font-style: normal; letter-spacing: -0.01em; }
.sans  { font-family: var(--f-sans); }
.mono  { font-family: var(--f-mono); letter-spacing: -0.02em; }

.display-xl { font-family: var(--f-display); font-weight: 500; font-size: 64px; line-height: 1.02; letter-spacing: -0.035em; }
.display-l  { font-family: var(--f-display); font-weight: 500; font-size: 46px; line-height: 1.05; letter-spacing: -0.03em; }
.display-m  { font-family: var(--f-display); font-weight: 500; font-size: 32px; line-height: 1.1;  letter-spacing: -0.025em; }
.display-s  { font-family: var(--f-display); font-weight: 500; font-size: 22px; line-height: 1.2;  letter-spacing: -0.02em; }
.title      { font-family: var(--f-sans); font-weight: 600; font-size: 17px; line-height: 1.3; letter-spacing: -0.015em; }
.eyebrow    { font-family: var(--f-sans); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); }
.label      { font-family: var(--f-sans); font-weight: 500; font-size: 12.5px; color: var(--ink-2); }
.lede       { font-family: var(--f-sans); font-weight: 400; font-size: 16px; line-height: 1.5; color: var(--ink-2); }
.body       { font-family: var(--f-sans); font-size: 13.5px; line-height: 1.55; }
.small      { font-size: 12px; color: var(--ink-2); }
.tiny       { font-size: 11px; color: var(--ink-3); }
.num        { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; font-weight: 500; letter-spacing: -0.02em; }

.dim  { color: var(--ink-3); }
.dim2 { color: var(--ink-4); }

/* ── Rules & dividers ───────────────────────────────────── */
.rule  { height: 1px; background: var(--rule); border: 0; }
.rule-2{ height: 1px; background: var(--rule-2); border: 0; }
.hair  { border: 0; border-top: 0.5px solid var(--rule); margin: 0; }

/* ── Hstack / vstack ────────────────────────────────────── */
.hstack { display: flex; align-items: center; }
.vstack { display: flex; flex-direction: column; }

/* ── Buttons — text-first, no cards ─────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border: 0.5px solid var(--rule);
  background: transparent;
  border-radius: 2px;
  color: var(--ink);
  font-size: 12.5px; font-weight: 450;
  transition: border-color .12s, background .12s;
}
.btn:hover { border-color: var(--ink-3); background: var(--ivory-2); }
.btn--ink { background: var(--ink); border-color: var(--ink); color: var(--ivory); }
.btn--ink:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn--ghost { border: 0; padding: 0 6px; height: 26px; }
.btn--ghost:hover { background: var(--ivory-2); }
.btn--accent { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 40%, transparent); }
.btn--accent:hover { background: var(--accent-tint); border-color: var(--accent); }
.btn--sm { height: 24px; font-size: 11.5px; padding: 0 8px; }
.btn--lg { height: 36px; padding: 0 14px; font-size: 13px; }
.btn kbd {
  margin-left: 4px; font-family: var(--f-mono); font-size: 10px;
  padding: 1px 4px; border: 0.5px solid var(--rule); border-radius: 2px;
  color: var(--ink-3);
}

/* ── Inputs ─────────────────────────────────────────────── */
.field {
  height: 28px; padding: 0 2px;
  border: 0; border-bottom: 0.5px solid var(--rule);
  background: transparent;
  font-size: 13px;
  outline: none;
  transition: border-color .15s;
}
.field:focus { border-bottom-color: var(--ink); }

.select {
  height: 28px; padding: 0 24px 0 10px;
  border: 0.5px solid var(--rule); border-radius: 2px;
  background: transparent; font-size: 12.5px;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%23999' stroke-width='1' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat; background-position: right 8px center;
}

/* ── Tags (editorial, not chips) ────────────────────────── */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--f-sans); font-size: 10.5px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--ink-3);
  padding: 0;
}
.tag::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 99px; background: currentColor; margin-right: 2px; }
.tag--ok     { color: var(--ok); }
.tag--warn   { color: var(--warn); }
.tag--danger { color: var(--danger); }
.tag--ink    { color: var(--ink-2); }

/* ── Underlined row link (list style) ──────────────────── */
.row {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 0;
  border-bottom: 0.5px solid var(--rule-2);
}
.row:last-child { border-bottom: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 14.5px; font-weight: 500; letter-spacing: -0.005em; }
.row-sub   { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.row:hover { cursor: default; }
.row--click:hover { cursor: pointer; background: color-mix(in oklch, var(--ivory-2) 60%, transparent); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }

/* ── Section ─────────────────────────────────────────────  */
.section { padding: 40px 56px; max-width: 1180px; margin: 0 auto; }
.section--narrow { max-width: 880px; }

/* ── Pull-quote / alert band (no card) ──────────────────── */
.band {
  padding: 16px 20px;
  border-left: 2px solid var(--accent);
  background: var(--accent-tint);
  border-radius: 0 2px 2px 0;
}

/* ── QR placeholder ─────────────────────────────────────── */
.qrbox { background: #fff; padding: 6px; border: 0.5px solid var(--rule); }

/* ── Micro-image placeholder (striped) ──────────────────── */
.ph {
  background:
    repeating-linear-gradient(135deg, var(--ivory-2) 0 8px, var(--ivory) 8px 16px);
  color: var(--ink-4); font-family: var(--f-mono); font-size: 10px;
  display: flex; align-items: center; justify-content: center;
}

/* ── Animations ─────────────────────────────────────────── */
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeUp .25s ease both; }

@keyframes scanPulse {
  0%, 100% { transform: translateY(-120px); opacity: 0.4; }
  50%      { transform: translateY(120px);  opacity: 0.9; }
}

/* ── Layout chrome ──────────────────────────────────────── */
.app-root { display: flex; flex-direction: column; height: 100vh; background: var(--ivory); }

.env-bar {
  height: 40px; padding: 0 20px;
  display: flex; align-items: center; gap: 16px;
  border-bottom: 0.5px solid var(--rule);
  background: var(--ivory);
  flex-shrink: 0;
}
.env-bar .wordmark {
  font-family: var(--f-display); font-weight: 600; font-size: 15px;
  letter-spacing: -0.02em;
}
.env-bar .wordmark em { font-style: normal; color: var(--ink-3); font-weight: 400; }

.device-switch { display: flex; gap: 0; }
.device-switch button {
  border: 0; background: transparent;
  padding: 4px 10px; font-size: 11.5px; color: var(--ink-3);
  border-bottom: 1px solid transparent;
  font-weight: 450;
}
.device-switch button.active { color: var(--ink); border-bottom-color: var(--ink); }

.canvas-host { flex: 1; min-height: 0; overflow: auto; }

/* ── Sidebar — thin, editorial ──────────────────────────── */
.aside {
  width: 200px; flex-shrink: 0;
  border-right: 0.5px solid var(--rule);
  padding: 24px 16px 20px 20px;
  display: flex; flex-direction: column;
  height: 100%;
  overflow-y: auto;
}
.aside-section { padding: 14px 0 4px; }
.nav-item {
  display: flex; align-items: baseline; gap: 8px;
  padding: 5px 0; font-size: 13px; font-weight: 450;
  color: var(--ink-2);
  cursor: pointer;
  border-left: 1px solid transparent;
  padding-left: 10px; margin-left: -10px;
}
.nav-item:hover { color: var(--ink); }
.nav-item.active { color: var(--ink); border-left-color: var(--accent); font-weight: 500; }
.nav-item .num-s { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-4); }

.search-field {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border: 0.5px solid var(--rule);
  background: var(--paper); border-radius: 2px;
  font-size: 12px; color: var(--ink-3);
  margin-bottom: 4px;
}
.search-field kbd {
  margin-left: auto; font-family: var(--f-mono); font-size: 10px;
  color: var(--ink-4);
}

/* ── Content column ─────────────────────────────────────── */
.main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.content-scroll { flex: 1; overflow: auto; }

/* ── Page header ────────────────────────────────────────── */
.page-head {
  padding: 48px 56px 32px;
  max-width: 1180px; margin: 0 auto;
  display: flex; align-items: flex-end; gap: 40px;
}
.page-head .meta { min-width: 0; flex: 1; }
.page-head .kicker { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); margin-bottom: 8px; }

/* ── Mobile frames ──────────────────────────────────────── */
.mobile-stage {
  min-height: 100%; padding: 40px;
  display: flex; align-items: flex-start; justify-content: center; gap: 40px; flex-wrap: wrap;
}

.mw-frame {
  width: 390px; height: 820px; background: var(--paper);
  border: 0.5px solid var(--rule); border-radius: 14px;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 20px 50px rgba(0,0,0,.06);
}
.mw-topbar {
  height: 36px; padding: 0 12px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 0.5px solid var(--rule);
  background: var(--ivory-2);
}
.mw-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ink-4); }
.mw-url {
  flex: 1; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3);
  padding: 3px 8px; background: var(--paper); border: 0.5px solid var(--rule); border-radius: 2px;
}
.mw-body { flex: 1; overflow: auto; padding: 20px; }

/* ── Phone (iOS-like, but editorial) ───────────────────── */
.phone {
  width: 390px; height: 844px; border-radius: 44px;
  overflow: hidden; position: relative;
  background: var(--ivory);
  box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 40px 80px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.1);
}
.phone-island {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 34px; border-radius: 24px; background: #000; z-index: 50;
}
.phone-status {
  height: 50px; padding: 22px 28px 0;
  display: flex; justify-content: space-between; align-items: center;
  font-family: -apple-system, "SF Pro", system-ui; font-weight: 590; font-size: 15px;
  position: relative; z-index: 10;
}
.phone-home {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 130px; height: 4px; border-radius: 99px; background: rgba(0,0,0,0.25);
  z-index: 60; pointer-events: none;
}
.phone-tabbar {
  height: 82px; padding: 8px 0 28px;
  display: flex; border-top: 0.5px solid var(--rule);
  background: color-mix(in oklch, var(--ivory) 92%, transparent);
  flex-shrink: 0;
}
.phone-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10px; color: var(--ink-3);
  font-weight: 500;
}
.phone-tab.active { color: var(--accent); }
.phone-content { position: absolute; inset: 50px 0 82px; overflow: auto; }

/* ── Tweaks panel ──────────────────────────────────────── */
.tweaks {
  position: fixed; right: 20px; bottom: 20px; z-index: 200;
  width: 260px; background: var(--paper);
  border: 0.5px solid var(--rule); padding: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,.08);
}
.tweaks.hidden { display: none; }

/* ── Command palette ────────────────────────────────────── */
.palette-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: oklch(20% 0.015 60 / 0.35);
  backdrop-filter: blur(4px);
  display: flex; justify-content: center; padding-top: 14vh;
}
.palette {
  width: 640px; max-width: 92vw;
  background: var(--paper);
  border: 0.5px solid var(--rule);
  box-shadow: 0 40px 80px rgba(0,0,0,.12);
  overflow: hidden;
}
.palette-input {
  width: 100%; padding: 18px 20px;
  border: 0; border-bottom: 0.5px solid var(--rule);
  background: transparent;
  font-family: var(--f-display); font-size: 20px; font-weight: 500;
  outline: none;
  letter-spacing: -0.02em;
}
.palette-input::placeholder { color: var(--ink-4); font-weight: 400; }
.palette-group { padding: 10px 0; }
.palette-group-title {
  padding: 6px 20px 4px; font-family: var(--f-mono);
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-4);
}
.palette-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 20px; cursor: pointer;
  font-size: 13.5px;
}
.palette-item:hover, .palette-item.selected { background: var(--ivory-2); }
.palette-item .pi-sub { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-4); }

/* ── Progress bar (hairline) ────────────────────────────── */
.bar { height: 2px; background: var(--rule-2); position: relative; }
.bar span { display: block; height: 100%; background: var(--ink); }
.bar.warn span   { background: var(--warn); }
.bar.danger span { background: var(--danger); }
.bar.accent span { background: var(--accent); }

/* ── Table (lists, not cards) ───────────────────────────── */
.lst { width: 100%; border-collapse: collapse; }
.lst thead th {
  font-family: var(--f-mono); font-weight: 500;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--ink-3); text-align: left;
  padding: 10px 16px 10px 0;
  border-bottom: 0.5px solid var(--rule);
}
.lst tbody td {
  padding: 14px 16px 14px 0;
  border-bottom: 0.5px solid var(--rule-2);
  vertical-align: baseline;
  font-size: 13.5px;
}
.lst tbody tr:hover td { background: color-mix(in oklch, var(--ivory-2) 50%, transparent); }
.lst td.num, .lst th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lst td.drop { color: var(--ink-3); font-size: 12px; }

/* ── Misc ───────────────────────────────────────────────── */
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 99px; font-family: var(--f-display);
  font-weight: 500; font-size: 11px; color: var(--ink); background: var(--ivory-2);
  border: 0.5px solid var(--rule);
}
.ornament { color: var(--ink-4); padding: 0 6px; }
</style>
</head>

function countByContainer(cid){ return ITEMS.filter(i=>i.containerId===cid).length; }
function countByRoom(rid){
  const furns = FURNITURE.filter(f=>f.roomId===rid).map(f=>f.id);
  const conts = CONTAINERS.filter(c=>furns.includes(c.furnId)).map(c=>c.id);
  return ITEMS.filter(i=>(i.furnId&&furns.includes(i.furnId))||(i.containerId&&conts.includes(i.containerId))).length;
}
const getContainer = cid=>CONTAINERS.find(c=>c.id===cid);
const getFurniture = fid=>FURNITURE.find(f=>f.id===fid);
const getRoom      = rid=>ROOMS.find(r=>r.id===rid);
const getFood      = fid=>FOOD.find(f=>f.id===fid);
const getItem      = iid=>ITEMS.find(i=>i.id===iid);
const getContact   = cid=>CONTACTS.find(c=>c.id===cid);
const getStore     = sid=>STORES.find(s=>s.id===sid);

function locationString(item){
  if(item.containerId){
    const c=getContainer(item.containerId); const f=c?getFurniture(c.furnId):null; const r=f?getRoom(f.roomId):null;
    return [r?.name,f?.name,c?.name].filter(Boolean).join(" / ");
  }
  if(item.furnId){ const f=getFurniture(item.furnId); const r=f?getRoom(f.roomId):null;
    return [r?.name,f?.name].filter(Boolean).join(" / ");
  }
  return "—";
}
function expiryTone(d){ if(d<0||d<=3) return "danger"; if(d<=7) return "warn"; return "ok"; }
function daysLabel(d){
  if(d<0)  return "expiré il y a "+Math.abs(d)+" j";
  if(d===0)return "aujourd'hui";
  if(d===1)return "demain";
  if(d<30) return "dans "+d+" jours";
  if(d<60) return "dans "+Math.round(d/7)+" sem.";
  if(d<365)return "dans "+Math.round(d/30)+" mois";
  return   "dans "+Math.round(d/365)+" an"+(d/365>=2?"s":"");
}

  const cells=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){h=(h*1664525+1013904223)>>>0; cells.push(((h>>>7)&3)>1?1:0);}
  [[0,0],[0,14],[14,0]].forEach(([ox,oy])=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++){
    const ring=(x===0||x===6||y===0||y===6); const inner=(x>=2&&x<=4&&y>=2&&y<=4);
    cells[(oy+y)*N+(ox+x)]=(ring||inner)?1:0;
  }});
  const px=size/N;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    <rect width={size} height={size} fill="#fff"/>
    {cells.map((v,i)=>v?<rect key={i} x={(i%N)*px} y={Math.floor(i/N)*px} width={px+0.3} height={px+0.3} fill={color}/>:null)}
  </svg>;
}

function CommandPalette({open, setOpen, setCurrent}){
  const [q, setQ] = React.useState("");
  React.useEffect(()=>{
    window.__openPalette = ()=>setOpen(true);
    const onKey = (e)=>{
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); setOpen(o=>!o); }
      else if(e.key==="Escape") setOpen(false);
    };
    window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  },[]);
  if(!open) return null;

  const actions = [
    {k:"a1", label:"Ajouter une possession",    sub:"N", go:()=>setCurrent("items")},
    {k:"a2", label:"Ajouter un produit",        sub:"F", go:()=>setCurrent("food")},
    {k:"a3", label:"Nouvelle liste de courses", sub:"C", go:()=>setCurrent("shopping")},
    {k:"a4", label:"Prêter un objet",           sub:"P", go:()=>setCurrent("loans")},
    {k:"a5", label:"Scanner un QR container",   sub:"⇧S",go:()=>setCurrent("scan")},
    {k:"a6", label:"Cuisiner une recette",      sub:"R", go:()=>setCurrent("recipes")},
  ];
  const items = ITEMS.slice(0,6).map(i=>({k:i.id,label:i.name,sub:locationString(i),go:()=>setCurrent("items")}));
  const food  = FOOD.filter(f=>f.daysLeft<7).slice(0,4).map(f=>({k:f.id,label:f.name,sub:daysLabel(f.daysLeft),go:()=>setCurrent("food")}));

  const filter = x=>!q||x.label.toLowerCase().includes(q.toLowerCase());

  return (
    <div className="palette-overlay" onClick={()=>setOpen(false)}>
      <div className="palette" onClick={e=>e.stopPropagation()}>
        <input autoFocus className="palette-input" value={q} onChange={e=>setQ(e.target.value)} placeholder="Chercher, agir…"/>
        {[
          {title:"Actions",    list:actions.filter(filter)},
          {title:"Objets",     list:items.filter(filter)},
          {title:"Périssables", list:food.filter(filter)},
        ].map(g => g.list.length ? (
          <div key={g.title} className="palette-group">
            <div className="palette-group-title">{g.title}</div>
            {g.list.map(x=>(
              <div key={x.k} className="palette-item" onClick={()=>{x.go(); setOpen(false);}}>
                <span>{x.label}</span>
                {x.sub && <span className="pi-sub">{x.sub}</span>}
              </div>
            ))}
          </div>
        ) : null)}
      </div>
    </div>
  );
}

function ViewFood(){
  const [filter, setFilter] = React.useState("all");
  const [loc, setLoc] = React.useState("all");
  const [q, setQ] = React.useState("");

  const locations = [...new Set(FOOD.map(f=>f.location))];
  const counts = {
    all: FOOD.length,
    expired: FOOD.filter(f=>f.daysLeft<0).length,
    urgent:  FOOD.filter(f=>f.daysLeft>=0 && f.daysLeft<=3).length,
    soon:    FOOD.filter(f=>f.daysLeft>3 && f.daysLeft<=7).length,
  };

  let list = FOOD;
  if(filter==="expired") list = list.filter(f=>f.daysLeft<0);
  else if(filter==="urgent") list = list.filter(f=>f.daysLeft>=0&&f.daysLeft<=3);
  else if(filter==="soon")   list = list.filter(f=>f.daysLeft>3&&f.daysLeft<=7);
  if(loc!=="all") list = list.filter(f=>f.location===loc);
  if(q) list = list.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));

  const grouped = {};
  list.forEach(f=>{(grouped[f.category]=grouped[f.category]||[]).push(f);});

  return (
    <div className="fade-in">
      <header className="page-head">
        <div className="meta">
          <div className="kicker">Garde-manger · frigo · congélateur · bar</div>
          <h1 className="display-l" style={{margin: 0}}>Ce qu'il reste<br/>à manger.</h1>
          <p className="lede" style={{margin: '12px 0 0', maxWidth: 560}}>
            {FOOD.length} produits suivis. {counts.expired + counts.urgent} réclament votre attention cette semaine.
          </p>
        </div>
      </header>

      <section className="section" style={{paddingTop: 0}}>
        {/* Filter tabs — editorial, underline-only */}
        <div className="hstack" style={{gap: 0, borderTop: '0.5px solid var(--rule)', borderBottom: '0.5px solid var(--rule)'}}>
          {[
            {k:"all",     l:"Tout",            n:counts.all},
            {k:"expired", l:"Expirés",         n:counts.expired, tone:"danger"},
            {k:"urgent",  l:"Urgents ≤ 3 j",   n:counts.urgent,  tone:"danger"},
            {k:"soon",    l:"Bientôt ≤ 7 j",   n:counts.soon,    tone:"warn"},
          ].map(t=>(
            <button key={t.k} onClick={()=>setFilter(t.k)} style={{
              background:'transparent', border: 0,
              padding: '18px 24px 18px 0', marginRight: 8,
              borderBottom: filter===t.k?'2px solid var(--ink)':'2px solid transparent',
              marginBottom: -0.5, cursor: 'pointer',
              color: filter===t.k?'var(--ink)':'var(--ink-3)',
              fontSize: 13, fontWeight: 450,
            }}>
              <span>{t.l}</span>
              <span className="num" style={{fontSize: 18, marginLeft: 8, color: t.tone==="danger"&&t.n>0?'var(--danger)':t.tone==="warn"&&t.n>0?'var(--warn)':'inherit'}}>{t.n}</span>
            </button>
          ))}
          <div style={{flex: 1}}/>
          <input className="field" placeholder="Chercher un produit…" value={q} onChange={e=>setQ(e.target.value)} style={{width: 200}}/>
          <select className="select" value={loc} onChange={e=>setLoc(e.target.value)} style={{marginLeft: 12}}>
            <option value="all">Tous emplacements</option>
            {locations.map(l=><option key={l}>{l}</option>)}
          </select>
          <button className="btn btn--accent btn--sm" style={{marginLeft: 12}}><Icon n="plus" s={12}/> Ajouter</button>
        </div>

        {/* Locations strip */}
        <div style={{display:'grid', gridTemplateColumns: `repeat(${locations.length}, 1fr)`, gap: 0, marginTop: 32, marginBottom: 16}}>
          {locations.map((l,i)=>{
            const foods = FOOD.filter(f=>f.location===l);
            const urgent = foods.filter(f=>f.daysLeft<7).length;
            return (
              <div key={l} onClick={()=>setLoc(l)} style={{
                padding: '12px 20px 12px 0',
                borderRight: i<locations.length-1?'0.5px solid var(--rule)':'none',
                cursor: 'pointer', opacity: loc===l||loc==="all"?1:0.5,
              }}>
                <div className="label">{l}</div>
                <div className="hstack" style={{alignItems: 'baseline', gap: 8, marginTop: 2}}>
                  <span className="num" style={{fontSize: 26}}>{foods.length}</span>
                  <span className="tiny dim">produits</span>
                </div>
                <div className="tiny dim">{urgent} à surveiller</div>
              </div>
            );
          })}
        </div>

        {/* Grouped list */}
        {Object.entries(grouped).map(([cat, foods])=>(
          <div key={cat} style={{marginTop: 40}}>
            <div className="hstack" style={{alignItems: 'baseline', gap: 16, marginBottom: 8}}>
              <h3 className="display-s" style={{margin: 0}}>{cat}</h3>
              <span className="tiny mono dim">{foods.length}</span>
            </div>
            <table className="lst">
              <thead><tr><th>Produit</th><th>Emplacement</th><th className="num">Quantité</th><th>Péremption</th><th className="num" style={{width:80}}></th></tr></thead>
              <tbody>
                {foods.map(f=>{
                  const tone = expiryTone(f.daysLeft);
                  return (
                    <tr key={f.id}>
                      <td><span className="serif" style={{fontSize: 15, fontWeight: 500}}>{f.name}</span></td>
                      <td className="drop mono" style={{fontSize: 11}}>{f.location}</td>
                      <td className="num">{f.qty}{f.unit}</td>
                      <td>
                        <span className={"num"} style={{color: tone==="danger"?'var(--danger)':tone==="warn"?'var(--warn)':'var(--ink)'}}>{daysLabel(f.daysLeft)}</span>
                      </td>
                      <td className="num">
                        <button className="btn btn--ghost btn--sm"><Icon n="minus" s={11}/></button>
                        <button className="btn btn--ghost btn--sm"><Icon n="dots" s={11}/></button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ))}
      </section>
    </div>
  );
}

/* ═════════════════ RECIPES ═════════════════ */
function ViewRecipes(){
  const [cat, setCat] = React.useState("Tout");
  const [active, setActive] = React.useState(null);
  const cats = ["Tout", "Repas", "Pâtisserie", "Cocktail"];
  const list = cat==="Tout"?RECIPES:RECIPES.filter(r=>r.category===cat);

  function availability(r){
    let have = 0; const missing = [];
    r.ingredients.forEach(ing=>{
      const f = getFood(ing.foodId);
      if(f && f.qty >= ing.qty) have++; else missing.push(ing);
    });
    return {have, total: r.ingredients.length, missing};
  }

  const useSoon = RECIPES.filter(r=>r.ingredients.some(ing=>{
    const f = getFood(ing.foodId); return f && f.daysLeft>=0 && f.daysLeft<=5;
  }));

  if(active) return <RecipeDetail r={active} onBack={()=>setActive(null)} availability={availability}/>;

  return (
    <div className="fade-in">
      <header className="page-head">
        <div className="meta">
          <div className="kicker">Répertoire de cuisine</div>
          <h1 className="display-l" style={{margin: 0}}>Recettes<span className="ornament">—</span><em style={{fontStyle:'italic'}}>neuf entrées.</em></h1>
          <p className="lede" style={{margin: '12px 0 0', maxWidth: 560}}>
            Des repas, des pâtisseries et quelques cocktails. Chaque recette connaît votre garde-manger —
            elle vous dira ce qu'il reste à acheter.
          </p>
        </div>
      </header>

      <section className="section" style={{paddingTop: 0}}>
        <div className="hstack" style={{gap: 0, borderTop: '0.5px solid var(--rule)', borderBottom: '0.5px solid var(--rule)'}}>
          {cats.map(c=>(
            <button key={c} onClick={()=>setCat(c)} style={{
              background:'transparent', border: 0, padding: '18px 28px 18px 0',
              marginBottom: -0.5, cursor: 'pointer',
              borderBottom: cat===c?'2px solid var(--ink)':'2px solid transparent',
              color: cat===c?'var(--ink)':'var(--ink-3)',
              fontFamily: 'var(--f-serif)', fontSize: 18, fontWeight: 400,
              fontVariationSettings: '"opsz" 48',
              letterSpacing: '-0.015em',
            }}>
              {c} <span className="num sans" style={{fontSize: 11, marginLeft: 4, color:'var(--ink-3)', fontFamily: 'var(--f-mono)'}}>{c==="Tout"?RECIPES.length:RECIPES.filter(r=>r.category===c).length}</span>
            </button>
          ))}
          <div style={{flex: 1}}/>
          <button className="btn btn--sm"><Icon n="sparkle" s={12}/> Avec ce que j'ai</button>
          <button className="btn btn--accent btn--sm" style={{marginLeft: 8}}><Icon n="plus" s={12}/> Nouvelle</button>
        </div>

        {cat==="Tout" && useSoon.length>0 && (
          <div style={{marginTop: 40}}>
            <div className="band">
              <div className="eyebrow" style={{color:'var(--accent)'}}>À cuisiner cette semaine</div>
              <div className="title" style={{marginTop: 4}}>Pour éviter le gaspillage.</div>
              <div style={{marginTop: 10, display: 'flex', flexWrap: 'wrap', gap: 8}}>
                {useSoon.map(r=>(
                  <button key={r.id} onClick={()=>setActive(r)} className="btn btn--sm">{r.name}<span className="dim" style={{marginLeft: 4}}>· {r.time} min</span></button>
                ))}
              </div>
            </div>
          </div>
        )}

        <div style={{marginTop: 40, display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 0}}>
          {list.map((r, i)=>{
            const a = availability(r);
            const complete = a.missing.length===0;
            return (
              <article key={r.id} onClick={()=>setActive(r)} style={{
                padding: '28px 32px 32px 0',
                borderRight: (i%Math.floor(1180/280))!==Math.floor(1180/280)-1?'0.5px solid var(--rule-2)':'none',
                borderBottom: '0.5px solid var(--rule)',
                cursor: 'pointer',
              }}>
                <div className="tiny mono dim" style={{textTransform:'uppercase', letterSpacing:'0.1em'}}>{r.category} · N° {i+1}</div>
                <h3 className="display-s" style={{margin: '10px 0 10px', fontWeight: 400}}>{r.name}</h3>
                <div className="small dim">
                  <span className="num">{r.time}</span> min  <span className="ornament">·</span>  <span className="num">{r.servings}</span> pers.  <span className="ornament">·</span>  {r.difficulty}
                </div>
                <div className="hstack" style={{marginTop: 18, gap: 10}}>
                  <div className="bar accent" style={{flex: 1}}>
                    <span style={{width: (a.have/a.total)*100+'%', background: complete?'var(--ok)':'var(--warn)'}}/>
                  </div>
                  <span className="num small">{a.have}/{a.total}</span>
                </div>
                <div className="tiny dim" style={{marginTop: 6}}>
                  {complete ? <em className="serif" style={{color: 'var(--ok)'}}>Tous les ingrédients sont là.</em> : <em className="serif">{a.missing.length} manquant{a.missing.length>1?"s":""}.</em>}
                </div>
              </article>
            );
          })}
        </div>
      </section>
    </div>
  );
}

        <button className="btn btn--ghost btn--sm" onClick={onBack} style={{marginBottom: 20}}>

        <div style={{marginTop: 36, padding: '16px 0', borderTop: '0.5px solid var(--rule)', borderBottom: '0.5px solid var(--rule)', display: 'flex', gap: 10}}>

          <button className="btn"><Icon n="cart" s={12} stroke/> Ajouter les manquants aux courses</button>
          <div style={{flex:1}}/>
          <button className="btn btn--ghost"><Icon n="edit" s={12} stroke/></button>
        </div>

        <div style={{marginTop: 40}}>

                  </div>

        </div>
      </section>
    </div>
  );
}

/* ═════════════════ SHOPPING ═════════════════ */
function ViewShopping(){
  const [shopMode, setShopMode] = React.useState(false);
  const [store, setStore] = React.useState("all");

  const byStore = {};
  SHOPPING.forEach(s=>{(byStore[s.store]=byStore[s.store]||[]).push(s);});
  const remaining = SHOPPING.filter(s=>!s.checked).length;
  const totalPrice = SHOPPING.filter(s=>!s.checked).reduce((t,s)=>t+s.price*s.qty,0);

  const stores = store==="all"?STORES:STORES.filter(s=>s.id===store);

  return (
    <div className="fade-in">
      <header className="page-head">
        <div className="meta">
          <div className="kicker">Liste de courses · semaine 17</div>
          <h1 className="display-l" style={{margin: 0}}>{remaining} articles<br/><em style={{fontStyle:'italic'}}>à rapporter.</em></h1>
          <p className="lede" style={{margin: '12px 0 0', maxWidth: 560}}>
            Environ <span className="num" style={{fontStyle: 'normal'}}>{totalPrice.toFixed(2)} €</span>,
            répartis sur {new Set(SHOPPING.filter(s=>!s.checked).map(s=>s.store)).size} magasins.
          </p>
        </div>
      </header>

      <section className="section" style={{paddingTop: 0}}>
        <div className="hstack" style={{gap: 12, padding: '16px 0', borderTop: '0.5px solid var(--rule)', borderBottom: '0.5px solid var(--rule)'}}>
          <select className="select" value={store} onChange={e=>setStore(e.target.value)}>
            <option value="all">Tous les magasins</option>
            {STORES.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <div style={{flex: 1}}/>
          <button className={"btn btn--sm " + (shopMode?"btn--ink":"")} onClick={()=>setShopMode(!shopMode)}>
            <Icon n="cart" s={12} stroke/> Mode course {shopMode?"· activé":""}
          </button>
          <button className="btn btn--accent btn--sm"><Icon n="plus" s={12}/> Ajouter</button>
        </div>

        <div style={{marginTop: 40, columnCount: stores.length > 1 ? 2 : 1, columnGap: 48}}>
          {stores.map(st=>{
            const items = (byStore[st.id]||[]);
            if(!items.length) return null;
            const aisles = {};
            items.forEach(i=>{(aisles[i.aisle]=aisles[i.aisle]||[]).push(i);});
            const done = items.filter(i=>i.checked).length;

            return (
              <div key={st.id} style={{breakInside: 'avoid', marginBottom: 48}}>
                <div style={{paddingBottom: 8, borderBottom: '0.5px solid var(--ink)'}}>
                  <div className="tiny mono dim" style={{textTransform: 'uppercase', letterSpacing: '0.14em'}}>{st.type}</div>
                  <div className="hstack" style={{alignItems: 'baseline', gap: 10, marginTop: 2}}>
                    <h3 className="display-s" style={{margin: 0}}>{st.name}</h3>
                    <span className="num tiny dim" style={{marginLeft: 'auto'}}>{done}/{items.length}</span>
                  </div>
                </div>
                <div>
                  {Object.entries(aisles).map(([aisle, its])=>(
                    <div key={aisle} style={{marginTop: 14}}>
                      <div className="eyebrow" style={{paddingBottom: 4, borderBottom: '0.5px solid var(--rule-2)'}}>{aisle}</div>
                      {its.map(i=><ShopRow key={i.id} item={i} mode={shopMode}/>)}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </section>
    </div>
  );
}
function ShopRow({item, mode}){
  const [checked, setChecked] = React.useState(item.checked);
  return (
    <div className="hstack" style={{
      padding: '10px 0', gap: 12, borderBottom: '0.5px solid var(--rule-2)',
      opacity: checked?0.4:1, cursor: mode?'pointer':'default',
    }} onClick={()=>mode && setChecked(!checked)}>
      <div style={{
        width: mode?18:14, height: mode?18:14,
        border: '0.5px solid ' + (checked?'var(--ink)':'var(--rule)'),
        background: checked?'var(--ink)':'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ivory)',
        flexShrink: 0,
      }}>{checked && <Icon n="check" s={mode?11:9}/>}</div>
      <div style={{flex: 1, textDecoration: checked?'line-through':'none'}}>
        <div className="serif" style={{fontSize: 14, fontWeight: 500}}>{item.name}</div>
        {item.auto && <div className="tiny dim" style={{fontStyle: 'italic', fontFamily:'var(--f-serif)'}}>auto — stock bas</div>}
      </div>
      <div className="num small" style={{width: 60, textAlign: 'right'}}>{item.qty}{item.unit}</div>
      <div className="num tiny dim" style={{width: 50, textAlign: 'right'}}>{(item.price*item.qty).toFixed(2)} €</div>
    </div>
  );
}

/* ═════════════════ LOANS ═════════════════ */

  const loans = MOVEMENTS.filter(m=>m.type==="loan-out");
  const open = loans.filter(l=>l.open);
  const overdue = loans.filter(l=>l.open&&l.overdue);
  return (
    <div className="fade-in">
      <header className="page-head">
        <div className="meta">
          <div className="kicker">Prêts · ce qui circule</div>

      <section className="section" style={{paddingTop: 0}}>
        <div style={{display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 64, borderTop: '0.5px solid var(--rule)', paddingTop: 32}}>
          <div>
            <div className="eyebrow">En cours</div>
            <h2 className="display-m" style={{margin: '6px 0 20px'}}>Prêts ouverts.</h2>
            {open.map(l=>{
              const it = getItem(l.itemId); const ct = getContact(l.contactId);
              const days = Math.ceil((new Date(l.due)-new Date("2026-04-20"))/(1000*60*60*24));
              return (
                <div key={l.id} style={{padding: '20px 0', borderBottom: '0.5px solid var(--rule)'}}>
                  <div className="hstack" style={{alignItems: 'baseline', gap: 14}}>
                    <div className="avatar" style={{width: 32, height: 32}}>{ct?.initials}</div>
                    <div style={{flex: 1}}>
                      <div className="serif" style={{fontSize: 17, fontWeight: 500}}>{it?.name}</div>
                      <div className="small dim">prêté à <span style={{color:'var(--ink)'}}>{ct?.name}</span> — <em>{l.note}</em></div>
                    </div>
                    {l.overdue
                      ? <span className="tag tag--danger">{Math.abs(days)} j retard</span>
                      : <span className="tag tag--warn">{days} j restants</span>}
                  </div>
                  <div className="hstack" style={{gap: 10, marginTop: 14}}>
                    <span className="tiny mono dim">
                      {new Date(l.date).toLocaleDateString('fr-FR')} → {new Date(l.due).toLocaleDateString('fr-FR')}
                    </span>

      <div>
        <div className="hstack" style={{gap: 0, borderTop: '0.5px solid var(--rule)', borderBottom: '0.5px solid var(--rule)', marginBottom: 20}}>
          <div style={{padding: '14px 20px 14px 0', borderRight: '0.5px solid var(--rule)', flex: 1}}>
            <div className="num" style={{fontSize: 32}}>{ITEMS.length}</div>
            <div className="tiny dim">Objets</div>
          </div>
          <div style={{padding: '14px 0 14px 20px', flex: 1}}>
            <div className="num" style={{fontSize: 32, color: openLoans.some(l=>l.overdue)?'var(--danger)':'var(--ink)'}}>{openLoans.length}</div>
            <div className="tiny dim">Prêts</div>
          </div>
        </div>
        <div className="eyebrow">À consommer</div>
        {expiring.map(f=>{
          const tone = expiryTone(f.daysLeft);
          return (
            <div key={f.id} className="row">
              <div className="row-main">
                <div className="serif" style={{fontSize: 14, fontWeight: 500}}>{f.name}</div>
                <div className="tiny dim">{f.qty}{f.unit} · {f.location}</div>
              </div>
              <span className={"tag tag--"+tone}>{daysLabel(f.daysLeft)}</span>
            </div>
          );
        })}
      </div>
    );
  }
  if(current==="items"){
    return (
      <div>
        {ITEMS.slice(0,10).map(i=>(
          <div key={i.id} className="row">
            <div className="row-main">
              <div className="serif" style={{fontSize: 14, fontWeight: 500}}>{i.name}</div>
              <div className="tiny mono dim">{locationString(i)}</div>
            </div>
            <span className="tag tag--ink">{i.category}</span>
          </div>
        ))}
      </div>
    );
  }
  if(current==="food") return <PhoneFood/>;
  if(current==="recipes"){
    return (
      <div>
        {RECIPES.map(r=>(
          <div key={r.id} className="row">
            <div className="row-main">
              <div className="serif" style={{fontSize: 14, fontWeight: 500}}>{r.name}</div>
              <div className="tiny dim">{r.category} · {r.time} min</div>
            </div>
          </div>
        ))}
      </div>
    );
  }
  if(current==="shopping") return <PhoneShopping/>;
  if(current==="loans"){
    const open = MOVEMENTS.filter(m=>m.type==="loan-out"&&m.open);
    return (
      <div>
        {open.map(l=>{
          const it = getItem(l.itemId); const ct = getContact(l.contactId);
          return (
            <div key={l.id} className="row">
              <div className="avatar" style={{width: 26, height: 26}}>{ct?.initials}</div>
              <div className="row-main">
                <div className="serif" style={{fontSize: 14, fontWeight: 500}}>{it?.name}</div>
                <div className="tiny dim">{ct?.name}</div>
              </div>
              {l.overdue && <span className="tag tag--danger">retard</span>}
            </div>
          );
        })}
      </div>
    );
  }
  return null;
}

/* ═════════════════ APP ROOT ═════════════════ */
function App(){
  const [device, setDevice] = React.useState(()=>localStorage.getItem("inv2.device")||"desktop");
  const [current, setCurrent] = React.useState(()=>localStorage.getItem("inv2.view")||"dashboard");
  const [paletteOpen, setPaletteOpen] = React.useState(false);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [accent, setAccent] = React.useState(()=>localStorage.getItem("inv2.accent")||window.TWEAK_DEFAULTS.accent);

  React.useEffect(()=>{localStorage.setItem("inv2.device", device);}, [device]);
  React.useEffect(()=>{localStorage.setItem("inv2.view", current);}, [current]);
  React.useEffect(()=>{localStorage.setItem("inv2.accent", accent); applyAccent(accent);}, [accent]);

  React.useEffect(()=>{
    const h = (e)=>{
      if(e.data?.type==="__activate_edit_mode") setTweaksOpen(true);
      if(e.data?.type==="__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", h);
    window.parent.postMessage({type:"__edit_mode_available"}, "*");
    return ()=>window.removeEventListener("message", h);
  }, []);

  function applyAccent(a){
    const defs = {
      prune:  { a:"42% 0.13 25",  t:"94% 0.025 25" },
      encre:  { a:"36% 0.14 260", t:"94% 0.025 260" },
      foret:  { a:"38% 0.09 155", t:"94% 0.022 155" },
      ocre:   { a:"48% 0.11 70",  t:"95% 0.028 70" },
    };
    const d = defs[a] || defs.prune;
    document.documentElement.style.setProperty('--accent',      `oklch(${d.a})`);
    document.documentElement.style.setProperty('--accent-tint', `oklch(${d.t})`);
  }

  const views = {
    dashboard: <ViewDashboard setCurrent={setCurrent}/>,
    items:     <ViewItems/>,
    food:      <ViewFood/>,
    recipes:   <ViewRecipes/>,
    shopping:  <ViewShopping/>,
    movements: <ViewMovements/>,
    loans:     <ViewLoans/>,
    rooms:     <ViewRooms/>,
    stores:    <ViewStores/>,
    contacts:  <ViewContacts/>,
    scan:      <ViewScan/>,
  };

  function persistAccent(a){
    setAccent(a);
    window.parent.postMessage({type:"__edit_mode_set_keys", edits:{accent:a}}, "*");
  }

  return (
    <div className="app-root">
      <div className="env-bar">
        <div className="wordmark">Intendance <em>— maison</em></div>
        <div style={{flex:1}}/>
        <div className="device-switch">
          {[
            {k:"desktop",    l:"Desktop"},
            {k:"mobile-web", l:"Mobile web"},
            {k:"mobile-app", l:"App téléphone"},
          ].map(d=>(
            <button key={d.k} className={device===d.k?"active":""} onClick={()=>setDevice(d.k)}>{d.l}</button>
          ))}
        </div>
      </div>

      <div className="canvas-host" data-screen-label={"01 " + current}>
        {device==="desktop" && (
          <div style={{display: 'flex', height: '100%'}}>
            <Sidebar current={current} setCurrent={setCurrent} setPaletteOpen={setPaletteOpen}/>
            <div className="main-col">
              <div className="content-scroll">{views[current]}</div>
            </div>
          </div>
        )}

        {device==="mobile-web" && (
          <div className="mobile-stage">
            <div>
              <div className="mw-frame">
                <div className="mw-topbar">
                  <div className="mw-dot"/><div className="mw-dot"/><div className="mw-dot"/>
                  <div className="mw-url">intendance.maison.local/{current}</div>
                </div>
                <div className="mw-body">
                  <MobileWebContent current={current} setCurrent={setCurrent}/>
                </div>
              </div>
              <div className="tiny mono dim" style={{textAlign: 'center', marginTop: 12}}>Mobile web · responsive · 390×820</div>
            </div>
          </div>
        )}

        {device==="mobile-app" && (
          <div className="mobile-stage">
            <div>
              <MobileApp/>
              <div className="tiny mono dim" style={{textAlign: 'center', marginTop: 12}}>App téléphone</div>
            </div>
          </div>
        )}

        <CommandPalette open={paletteOpen} setOpen={setPaletteOpen} setCurrent={setCurrent}/>
      </div>

      <div className={"tweaks " + (tweaksOpen?"":"hidden")}>
        <div className="hstack" style={{marginBottom: 12}}>
          <div className="eyebrow">Tweaks</div>
          <button className="btn btn--ghost btn--sm" style={{marginLeft: 'auto'}} onClick={()=>setTweaksOpen(false)}>
            <Icon n="x" s={11}/>
          </button>
        </div>
        <div className="label" style={{marginBottom: 8}}>Couleur d'accent</div>
        <div style={{display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6}}>
          {[
            {k: "prune", c: "oklch(42% 0.13 25)",  l: "Prune"},
            {k: "encre", c: "oklch(36% 0.14 260)", l: "Encre"},
            {k: "foret", c: "oklch(38% 0.09 155)", l: "Forêt"},
            {k: "ocre",  c: "oklch(48% 0.11 70)",  l: "Ocre"},
          ].map(p=>(
            <button key={p.k} onClick={()=>persistAccent(p.k)} style={{
              padding: 6, border: '0.5px solid ' + (accent===p.k?'var(--ink)':'var(--rule)'),
              background: 'transparent', cursor: 'pointer', display: 'flex',
              flexDirection: 'column', alignItems: 'center', gap: 4, fontSize: 10.5,
              fontFamily: 'var(--f-serif)',
            }}>
              <div style={{width:'100%', height: 20, background: p.c}}/>
              {p.l}
            </button>
          ))}
        </div>
        <div className="tiny dim" style={{marginTop: 12, fontStyle: 'italic', fontFamily: 'var(--f-serif)'}}>⌘K ouvre la palette de commandes</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
